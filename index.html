s it: enemies inside take 30 damage and are blasted away."},{n:"Nova",b:"Vex's long-lost brother, though neither of them knows it yet. They were separated when they were young, and Nova was taken in by the Blink Master on the other side of the world. He came to Rumble Stadium to train more and show off his master's ways.",st:3,hp:.9,sp:1,g:"BLINK",cd:6,c:"#b388ff",r:"ASSASSIN",d:"Teleports you a short hop forward, straight through walls, leaving a fading ghost behind."},{n:"Tank",b:"An old security guard at Rumble Stadium who found a strange needle on the floor and picked it up. The needle stabbed him, and afterward he gained the Force Field skill.",st:4,hp:1.35,sp:.92,g:"FORCE FIELD",cd:11,c:"#6df0ff",r:"TANK",d:"A glowing hex shield: you take no damage at all for 2.5 seconds."},{n:"Pix",b:"A young, newly hired nurse at Rumble Stadium who gets lost easily. She ended up in the wrong wing of Rumble Stadium City, where she found out about the horrific research being done there.",st:5,hp:.85,sp:1.05,g:"HEAL PULSE",cd:12,c:"#7dff8a",r:"SUPPORT",d:"A short charge, then a green pulse heals you and nearby team-mates for 55 HP."},{n:"Vex",b:"A ninja born into the Flower Clan, which is known for producing great ninjas with amazing speed. Wanting to train more, Vex left his home clan to travel and become stronger.",st:6,hp:.92,sp:1.15,g:"DASH",cd:8,c:"#ff2e63",r:"ASSASSIN",d:"Dash forward very fast and take no damage for a moment."},{n:"Apex",b:"A pyromaniac obsessed with bombs. She came to Rumble Stadium to find better materials and equipment so that she can create the strongest, most beautiful bomb in the world.",st:7,hp:1.12,sp:1.06,g:"GRENADE",cd:9,c:"#ffc61a",r:"ALL-ROUNDER",d:"Drag the skill button to place a grenade exactly where you want (drag further to throw further), or just tap to auto-lob it at the nearest enemy: 34 damage in the blast and they fly back."},{n:"Forge",b:"A Rumble Stadium robot that was once controlled by the Z.A program. A mysterious hero hit them with a hijack skill and freed them from its control. Now they roam the stadium looking for that hero.",st:8,hp:1.2,sp:.98,g:"BULLDOZE",cd:9,c:"#ffd23f",r:"BRUISER",d:"Charges forward like a wrecking ball: you take no damage while rolling, every enemy in your path takes 30 damage and is smashed aside, and breakable blocks in your way are smashed to pieces."},{n:"Pop!",b:"A small yellow balloon that gained sentience by mistake. Researchers at the Rumble Stadium research center were testing the Z.A solution, which adds skills to inanimate objects, when a researcher's daughter playfully dropped her balloon into it.",st:9,hp:.95,sp:1.08,g:"PUFF UP",cd:12,c:"#ffd23f",r:"ALL-ROUNDER",d:"Pop swells up like a balloon for 3 seconds: you take half damage and anything that hits you up close is bounced away. When the air runs out you go POP! and shove every close enemy back."},{n:"Ash",b:"Ash is a child created in the Z.A Lab, engineered with the combined skills of three people. The result was the ultimate weapon, one capable of annihilating a hero in a single shot. But his unstable emotions proved impossible to control, and he broke out of the Rumble Stadium research lab. Now he runs rampant through the stadium.",st:10,hp:1.1,sp:.9,g:"BIG SHOT",cd:16,c:"#ff3b3b",r:"BRUISER",d:"Fires one giant bullet that flies through enemies: anyone caught in it dies instantly. Shields still block it."},{n:"Zagger",b:"Zagger believes that living life in a straight line is the wrong way to live. His skill caught the eye of Z, the leader of Rumble Stadium, who recruited him as a security guard. But when Zagger discovered the experiments being carried out inside the stadium, he quit on the spot. He never made it out: just as he was about to leave, he was captured and trapped inside Rumble Stadium.",st:11,hp:.9,sp:1.12,g:"ZIGZAG",cd:10,c:"#19e3ff",r:"SPEEDSTER",d:"Darts forward in a sharp zigzag and takes no damage while moving. Enemies he zips past are left confused for 1.8 seconds and stumble around at random."},{n:"Nico",b:"Nico is a boy from another world who can swap places with anyone within a certain range. One day while he was training, his skill went out of control and swapped him with a researcher inside Rumble Stadium. The Z.A program saw it happen and set out to capture him and experiment on him, but they never managed to lay a hand on him. Nico stayed at Rumble Stadium, searching for a way back to his home world.",st:12,hp:.92,sp:1.1,g:"SWAP",cd:10,c:"#3df2c0",r:"ASSASSIN",d:"Opens a rift and swaps places with the nearest enemy up to 460 away. They are left confused for 1.2 seconds, and Nico takes no damage for a moment."},{n:"Link",b:"Link is a wandering swordsman who trained so long that his blades faded from sight. Nobody at Rumble Stadium has ever seen his swords, only the cuts of air they leave behind. He entered the tournament to find a rival worthy of seeing them.",st:13,hp:1.05,sp:1.04,g:"AIR SLASH",cd:8,c:"#6ecbff",r:"ASSASSIN",d:"Swings his invisible sword and fires one long, fast slash in the direction you aim. It cuts through every enemy in its path for 45 damage and breaks blocks."},{n:"Sumi",b:"Sumi is a skilled calligrapher with a strange skill: if someone steps into her spilled ink, a clone of her pops up. Because of this creepy ability, people called her weird and avoided her. Just as she was about to give up on life, she met Ace. He accepted her, helped her through her darkest moment, and invited her to travel with him.",st:14,hp:1.05,sp:1.02,g:"INK PATCH",cd:14,c:"#6a4cff",r:"SUPPORT",d:"Paints a giant ink puddle on the arena that slows every enemy standing in it, plus a smaller one nearby. Keep 2 enemies inside the ink for a moment and a clone steps out of it to fight on its own until it falls or the match ends."},{n:"Mr Cha-Ching",b:"Mr Cha-Ching is the richest man in all of Stadium City and was one of the biggest investors in Rumble Stadium. But when the stadium changed leaders, the two had a falling out. As he prepared to pull out his investment, the new stadium leader captured him, and now he is trapped inside Rumble Stadium.",st:15,hp:1.1,sp:1,g:"PAYDAY",cd:12,c:"#ffd23f",r:"SUPPORT",d:"Press it to load green coins and start an 8 second timer. Keep shooting: misses cost nothing. Each coin that hits puts the enemy IN DEBT for 5 seconds, which blocks their skill, and adds 4 seconds to your timer so you can hit a second target."},{n:"Janet",b:"A skilled gunslinger with a body of steel. Janet is the main bodyguard of the Hero Hideout in Rumble Stadium.",st:16,hp:1.42,sp:.9,g:"BULWARK",cd:12,c:"#ff7a45",r:"TANK",d:"Raise her shield: you take no damage for 3 seconds, and the burst hits nearby enemies for 12 damage. In the last second, your next 2 hits heal you for the damage they deal."},{n:"Gizmo",b:"Gizmo is a robot created at the request of Mr Cha-Ching, but he was abandoned mid-construction after Mr Cha-Ching had a falling out with Rumble Stadium. He was found by Apex, who completed him, and now he follows her around, helping her complete her dream.",st:17,hp:1.08,sp:1,g:"ROCKETS",cd:11,c:"#4fe3ff",r:"ALL-ROUNDER",d:"Drag the skill button to aim, then release to launch 5 rockets in a tight spread. Each rocket hits for 45 damage, far stronger than your ultra, and the recoil pushes you back."}],zh={"ALL-ROUNDER":"#ff6fb5",SPEEDSTER:"#ffe14d",BRUISER:"#ff8a3d",ASSASSIN:"#b388ff",TANK:"#4aa3ff",SUPPORT:"#5fe87a"},Xl={STARTER:"#2fc9b8",RARE:"#3fd466","SUPER RARE":"#3fa0ff",LEGENDARY:"#ffc61a",EPIC:"#ff4bd0",COMMON:"#9aa4b8"},Gc={Ace:"STARTER",Pix:"RARE",Bolt:"RARE",Rex:"RARE",Tank:"RARE",Nova:"SUPER RARE",Vex:"LEGENDARY",Apex:"LEGENDARY",Forge:"EPIC","Pop!":"EPIC",Ash:"SUPER RARE",Zagger:"LEGENDARY",Nico:"EPIC",Link:"LEGENDARY",Sumi:"EPIC","Mr Cha-Ching":"LEGENDARY",Janet:"LEGENDARY",Gizmo:"SUPER RARE"},s4=tt.map((e,o)=>o).sort((e,o)=>{const a=["STARTER","RARE","SUPER RARE","LEGENDARY","EPIC"],n=l=>{const r=a.indexOf(Gc[tt[l].n]);return r<0?-1:r};return n(e)-n(o)||e-o}),Ge=e=>zh[tt[e].r]
