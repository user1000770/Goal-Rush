for 2.5 seconds."},{n:"Pix",b:"A young, newly hired nurse at Rumble Stadium who gets lost easily. She ended up in the wrong wing of Rumble Stadium City, where she found out about the horrific research being done there.",st:5,hp:.85,sp:1.05,g:"HEAL PULSE",cd:12,c:"#7dff8a",r:"SUPPORT",d:"A short charge, then a green pulse heals you and nearby team-mates for 55 HP."},{n:"Vex",b:"A ninja born into the Flower Clan, which is known for producing great ninjas with amazing speed. Wanting to train more, Vex left his home clan to travel and become stronger.",st:6,hp:.92,sp:1.15,g:"DASH",cd:8,c:"#ff2e63",r:"ASSASSIN",d:"Dash forward very fast and take no damage for a moment."},{n:"Apex",b:"A pyromaniac obsessed with bombs. She came to Rumble Stadium to find better materials and equipment so that she can create the strongest, most beautiful bomb in the world.",st:7,hp:1.12,sp:1.06,g:"GRENADE",cd:9,c:"#ffc61a",r:"ALL-ROUNDER",d:"Drag the skill button to place a grenade exactly where you want (drag further to throw further), or just tap to auto-lob it at the nearest enemy: 34 damage in the blast and they fly back."},{n:"Forge",b:"A Rumble Stadium robot that was once controlled by the Z.A program. A mysterious hero hit them with a hijack skill and freed them from its control. Now they roam the stadium looking for that hero.",st:8,hp:1.2,sp:.98,g:"BULLDOZE",cd:9,c:"#ffd23f",r:"BRUISER",d:"Charges forward like a wrecking ball: you take no damage while rolling, every enemy in your path takes 30 damage and is smashed aside, and breakable blocks in your way are smashed to pieces."},{n:"Pop!",b:"A small yellow balloon that gained sentience by mistake. Researchers at the Rumble Stadium research center were testing the Z.A solution, which adds skills to inanimate objects, when a researcher's daughter playfully dropped her balloon into it.",st:9,hp:.95,sp:1.08,g:"PUFF UP",cd:12,c:"#ffd23f",r:"ALL-ROUNDER",d:"Pop swells up like a balloon for 3 seconds: you take half damage and anything that hits you up close is bounced away. When the air runs out you go POP! and shove every close enemy back."},{n:"Ash",b:"Ash is a child created in the Z.A Lab, engineered with the combined skills of three people. The result was the ultimate weapon, one capable of annihilating a hero in a single shot. But his unstable emotions proved impossible to control, and he broke out of the Rumble Stadium research lab. Now he runs rampant through the stadium.",st:10,hp:1.1,sp:.9,g:"BIG SHOT",cd:16,c:"#ff3b3b",r:"BRUISER",d:"Fires one giant bullet that flies through enemies: anyone caught in it dies instantly. Shields still block it."},{n:"Zagger",b:"Zagger believes that living life in a straight line is the wrong way to live. His skill caught the eye of Z, the leader of Rumble Stadium, who recruited him as a security guard. But when Zagger discovered the experiments being carried out inside the stadium, he quit on the spot. He never made it out: just as he was about to leave, he was captured and trapped inside Rumble Stadium.",st:11,hp:.9,sp:1.12,g:"ZIGZAG",cd:10,c:"#19e3ff",r:"SPEEDSTER",d:"Darts forward in a sharp zigzag and takes no damage while moving. Enemies he zips past are left confused for 1.8 seconds and stumble around at random."},{n:"Nico",b:"Nico is a boy from another world who can swap places with anyone within a certain range. One day while he was training, his skill went out of control and swapped him with a researcher inside Rumble Stadium. The Z.A program saw it happen and set out to capture him and experiment on him, but they never managed to lay a hand on him. Nico stayed at Rumble Stadium, searching for a way back to his home world.",st:12,hp:.92,sp:1.1,g:"SWAP",cd:10,c:"#3df2c0",r:"ASSASSIN",d:"Opens a rift and swaps places with the nearest enemy up to 460 away. They are left confused for 1.2 seconds, and Nico takes no damage for a moment."},{n:"Link",b:"Link is a wandering swordsman who trained so long that his blades faded from sight. Nobody at Rumble Stadi
