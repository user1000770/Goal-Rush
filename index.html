/* ---------- presence (online dot) ---------- */

/* ---------- data ---------- */
function load(){
 return ctx().then(function(){var F=FB.F,db=FB.db;
  return Promise.all([
   F.getDocs(F.query(F.collection(db,"fr"),F.where("u","array-contains",me))),
   F.getDocs(F.query(F.collection(db,"frq"),F.where("to","==",me))),
   F.getDocs(F.query(F.collection(db,"frq"),F.where("from","==",me)))])
 }).then(function(r){
  var fr=[],inq=[],out=[];
  r[0].forEach(function(d){var x=d.data()||{},u=x.u||[],o=u[0]===me?u[1]:u[0];fr.push({id:d.id,uid:o,name:String((x.nm||{})[o]||"Player")})});
  r[1].forEach(function(d){var x=d.data()||{};inq.push({id:d.id,uid:x.from,name:String(x.fn||"Player")})});
  r[2].forEach(function(d){var x=d.data()||{};out.push({id:d.id,uid:x.to,name:String(x.tn||"Player")})});
  st.fr=fr;st.inq=inq;st.outq=out;setBadge();
  return Promise.all(fr.map(function(f){var F=FB.F;return F.getDoc(F.doc(FB.db,"pres",f.uid)).then(function(d){var x=d.exists()?d.data():null;st.pd[f.uid]=x;st.pres[f.uid]=!!(x&&Date.now()-x.t<80000)}).catch(function(){st.pres[f.uid]=false})}))
 }).then(function(){st.msg="";sync();if(open&&st.tab!==2)draw()},function(e){st.msg=errTxt(e);if(open)draw()});
}
function search(q){
 q=String(q||"").trim();if(!q){st.msg="TYPE A PLAYER NAME";draw();return}
 st.msg="SEARCHING...";st.res=null;draw();
 ctx().then(function(){var F=FB.F;return F.getDocs(F.query(F.collection(FB.db,"leaderboard"),F.where("name","==",q),F.limit(8)))}).then(function(snap){
  var a=[];snap.forEach(function(d){if(d.id!==me)a.push({uid:d.id,name:String((d.data()||{}).name||q).slice(0,20)})});
  st.res=a;st.msg=a.length?"":"NO PLAYER FOUND. NAMES MUST MATCH EXACTLY";draw()
 }).catch(function(e){st.msg=errTxt(e);draw()});
}
function rel(uid){for(var i=0;i<st.fr.length;i++)if(st.fr[i].uid===uid)return"friend";for(i=0;i<st.outq.length;i++)if(st.outq[i].uid===uid)return"sent";for(i=0;i<st.inq.length;i++)if(st.inq[i].uid===uid)return"got";return""}
function sendReq(i){var p=st.res&&st.res[i];if(!p)return;
 ctx().then(function(){var F=FB.F;return F.setDoc(F.doc(FB.db,"frq",p.uid+"_"+me),{from:me,to:p.uid,fn:nm(),tn:p.name,t:Date.now()})}).then(function(){st.msg="REQUEST SENT TO "+p.name.toUpperCase();return load()}).then(function(){draw()}).catch(function(e){st.msg=errTxt(e);draw()})}
function accept(id){var r=null;for(var i=0;i<st.inq.length;i++)if(st.inq[i].id===id)r=st.inq[i];if(!r)return;
 ctx().then(function(){var F=FB.F,u=[me,r.uid].sort(),n={};n[me]=nm();n[r.uid]=r.name;
  return F.setDoc(F.doc(FB.db,"fr",u.join("_")),{u:u,nm:n,t:Date.now()}).then(function(){return F.deleteDoc(F.doc(FB.db,"frq",id))})
 }).then(function(){st.msg=r.name.toUpperCase()+" IS NOW YOUR FRIEND!";return load()}).then(function(){draw()}).catch(function(e){st.msg=errTxt(e);draw()})}
function del(col,id,msg){ctx().then(function(){var F=FB.F;return F.deleteDoc(F.doc(FB.db,col,id))}).then(function(){st.msg=msg;return load()}).then(function(){draw()}).catch(function(e){st.msg=errTxt(e);draw()})}

/* ---------- party ---------- */
var party=null;
function fresh(t,w){return Math.abs(Date.now()-(t||0))<w}
function nameOf(u){for(var i=0;i<st.fr.length;i++)if(st.fr[i].uid===u)return st.fr[i].name;var d=st.pd[u];return String(d&&d.n||"Player")}
function setPt(){window.__grPt=party?{uid:party.uid,name:party.name,hero:party.hero,i:party.i,on:party.on,k:party.hero+"."+(party.on?1:0)+"."+party.name+"."+String(party.i)}:null;setBadge()}
function dissolve(m){party=null;st.formed=false;pub({pt:null,ld:0,inv:null,q:null,c:null,cq:null});if(m)st.msg=m;setPt();if(open)draw()}
function sync(){
 if(!me)return;var m=st.my,p=m.pt,inv=m.inv,i,d;
 st.invs=[];
 st.fr.forEach(function(f){var x=st.pd[f.uid];if(x&&x.inv&&x.inv.to===me&&fresh(x.inv.t,90000)&&!st.dec[f.uid+"_"+x.inv.t]&&p!==f.uid)st.invs.push({uid:f.uid,name:f.name,t:x.inv.t})});
 if(inv&&!fresh(inv.t,90000)){pub({inv:null});inv=null}
 if(inv){d=st.pd[inv.to];if(d&&d.pt===me){pub({pt:inv.to,ld:1,inv:null,q:null,c:null,cq:null});p=inv.to;st.accT=Date.now()}}
 var was=!!party;
 if(p){d=st.pd[p];
  if(d&&d.pt===me){if(!st.formed){st.formed=true;st.lastQ=d.q||0}
   if(!party)st.msg="";party={uid:p,name:nameOf(p),hero:d.h|0,i:d.i,on:fresh(d.t,80000),lead:!!m.ld};
   if(!party.on&&!fresh(d.t,180000)){dissolve("PARTY ENDED");return}
   if(d.q&&d.q!==st.lastQ&&fresh(d.q,60000)){var go=window.GR_HOME&&!document.getElementById("grxOv")&&!document.getElementById("mpp");if(go){st.lastQ=d.q;st.qw=Date.now()+30000;try{window.__grPartyGo&&window.__grPartyGo(d.q)}catch(e){}}}
  }else if(d&&st.formed){dissolve("PARTY ENDED");return}
  else if(d&&!st.formed&&!fresh(st.accT,60000)){pub({pt:null,ld:0});party=null}
  else party=null
 }else{party=null;st.formed=false}
 setPt();if(was!==!!party&&open)draw()}
function partnerUid(){return st.my.pt||(st.my.inv&&st.my.inv.to)||""}
function tickParty(){
 if(document.hidden||!active()||!me)return;var u=partnerUid();if(!u)return;
 var q=Date.now()<st.qw;st.pt=(st.pt||0)+1;if(!q&&st.pt%3)return;
 var F=FB.F;F.getDoc(F.doc(FB.db,"pres",u)).then(function(dc){st.pd[u]=dc.exists()?dc.data():null;
  if(party&&(hero()!==st.my.h||hinfo().join()!==String(st.my.i)))pub({});sync()}).catch(function(){})}
setInterval(tickParty,1000);
function invite(u){if(party){st.msg="LEAVE YOUR PARTY FIRST";draw();return}

function cancelInv(){pub({inv:null,ld:0});st.msg="INVITE CANCELLED";draw()}
function acceptInv(u,t){if(party)dissolve();st.accT=Date.now();st.formed=false;

function declineInv(u,t){st.dec[u+"_"+t]=1;sync();draw()}

 start:function(){var q=Date.now();st.lastQ=q;st.qw=Date.now()+30000;pub({q:q,c:null,cq:null});return q},

function ui(){if(ov)return;css();
 ov=document.createElement("div");ov.id="grFr";stop(ov);
 ov.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest("[data-a]");if(t){act(t.getAttribute("data-a"),t.getAttribute("data-i"));return}if(e.target===ov)hide()});

 document.body.appendChild(ov)}
function stop(el){["pointerdown","touchstart","mousedown","pointerup","touchend","mouseup"].forEach(function(n){el.addEventListener(n,function(e){e.stopPropagation()},{passive:true})})}
function act(a,i){
 if(a==="x")hide();else if(a==="t0"||a==="t1"||a==="t2"){st.tab=+a[1];st.msg="";draw()}
 else if(a==="login"){hide();try{G().openAccount()}catch(e){}}
 else if(a==="srch"){var v=document.getElementById("grFrIn");search(v&&v.value)}
 else if(a==="add")sendReq(+i);
 else if(a==="acc")accept(i);
 else if(a==="dec")del("frq",i,"REQUEST DECLINED");
 else if(a==="can")del("frq",i,"REQUEST CANCELLED");
 else if(a==="inv")invite(i);else if(a==="cinv")cancelInv();else if(a==="lv")window.__grPartyLeave();
 else if(a==="pacc"){var pp=i.split("|");acceptInv(pp[0],pp[1])}else if(a==="pdec"){pp=i.split("|");declineInv(pp[0],pp[1])}
